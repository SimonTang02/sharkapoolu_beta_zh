name: 核心组件跨平台冒烟检查
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  core:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      JOBBOT_PRIVATE_DIR: ${{ runner.temp }}/sharkapoolu-platform-private
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: 安装核心组件与 PDF 扩展
        run: python -m pip install -e ".[resume]"
      - name: 初始化并检查空白私有模板
        run: |
          python -m job_bot.private_config init
          python -m job_bot.private_config check
          python -m job_bot.easy_cli check
      - name: 测试简历导入、手动数据库和材料/模板契约
        run: python -m unittest cv.test_resume_import job_bot.test_manual_database cv.bot.test_bot application_bot.test_manual_kit
      - name: 运行 PowerShell 原生初始化流程
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\scripts\bootstrap.ps1 -WithResume
      # 此处不对真实账户、门户提交、TeX 渲染或 SSH RPC 进行冒烟测试。
