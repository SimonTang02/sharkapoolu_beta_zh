[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sharkapoolu-zh"
version = "0.1.0"
description = "用于职位发现、定制简历和申请跟踪的智能体工具集。"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "SimonTang02"}]
keywords = ["job-search", "ai-agents", "resume", "browser-automation", "hardware-engineering"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
dependencies = []

[project.optional-dependencies]
browser = ["playwright>=1.55,<2"]
resume = ["pypdf>=5,<7"]
dev = []

[project.scripts]
jobbot = "job_bot.bot:main"
applybot = "application_bot.cli:main"
cvbot = "cv.bot.bot:main"
jobbot-config = "job_bot.config_inspect:main"
jobbot-private = "job_bot.private_config:main"
jobbot-db = "job_bot.shared_database:main"
jobbot-settings = "job_bot.easy_cli:main"

[project.urls]
Repository = "https://github.com/SimonTang02/sharkapoolu_zh"
Documentation = "https://github.com/SimonTang02/sharkapoolu_zh/tree/main/docs"
Issues = "https://github.com/SimonTang02/sharkapoolu_zh/issues"

[tool.setuptools]
py-modules = ["private_paths"]

[tool.setuptools.packages.find]
include = ["application_bot*", "cv*", "examples", "job_bot*", "schemas"]
namespaces = true

[tool.setuptools.package-data]
application_bot = ["templates/manual_kit/*"]
cv = ["latex/*"]
examples = ["*.json", "*_template.sql", "*_template.tex", "*_template.csv", "README.md"]
job_bot = [
  "*.json",
  "*.toml",
  "*.txt",
  "env.template",
  "schema.sql",
  "config/*.json",
  "config/**/*.json",
  "source_lists/*.md",
]
schemas = ["*.json"]
